<h2>Day 1: From priors to posteriors</h2>
<ol>
<li><p>Two districts share the prior. District P has 200 km and 90 bursts in five years; district Q has 2 km and 3 bursts. Which statement about their posteriors holds?</p><ul><li><b>A.</b> P's posterior depends more on the prior than Q's</li><li><b>B.</b> Q's posterior is wider and closer to the prior's centre</li><li><b>C.</b> Both have the same width because the prior is the same</li><li><b>D.</b> Q's posterior is narrow because 3 bursts is a small number</li></ul></li>
<li><p>A colleague sets the prior on the log burst rate by fitting it to the five years of observed counts, then fits the model to the same counts. What is the problem?</p><ul><li><b>A.</b> Priors may never use data of any kind</li><li><b>B.</b> Nothing: with 700 counts the prior does not matter</li><li><b>C.</b> The data are used twice, so the posterior is too sure</li><li><b>D.</b> The sampler cannot handle a prior estimated from data</li></ul></li>
<li><p>Juhaina asks why the model does not estimate a coefficient for log km, as it does for age. What do you answer?</p><ul><li><b>A.</b> Because bursts are assumed proportional to length, so its coefficient is fixed at 1</li><li><b>B.</b> Because network length does not affect the number of bursts</li><li><b>C.</b> Because the sampler cannot estimate a coefficient on a logarithm</li><li><b>D.</b> Because its prior is centred on 1 and the data agree</li></ul></li>
<li><p>A fit reports R-hat 1.003, bulk ESS 2,100, no divergences, and 40% of draws at the maximum tree depth. Another reports no divergences and R-hat 1.21. Which do you send back?</p><ul><li><b>A.</b> The first, because 40% of trees are capped</li><li><b>B.</b> Neither, because neither has divergences</li><li><b>C.</b> Both, because each has a warning</li><li><b>D.</b> The second, because its chains disagree</li></ul></li>
<li><p>Shabib asks why the posterior of a 2 km rural district spans rates from 0.06 to 0.5 bursts per km-year, while a 180 km urban district's spans 0.07 to 0.10, although both used the same prior and five years of data. What is the reason?</p><ul><li><b>A.</b> Its few bursts give a flat likelihood, so the prior shapes much of its posterior</li><li><b>B.</b> The rural district's prior was set wider, because rural rates are known to vary more</li><li><b>C.</b> The sampler mixed worse for the rural district, which widens its interval</li><li><b>D.</b> Rural rates vary more from year to year by nature, whatever the data say</li></ul></li>
<li><p>You simulate a year of bursts for a district with a rate of 0.2 bursts per km-year and 15 km of mains. Which line simulates one year?</p><ul><li><b>A.</b> rng.poisson(0.2)</li><li><b>B.</b> rng.poisson(0.2 * 15)</li><li><b>C.</b> rng.poisson(0.2) * 15</li><li><b>D.</b> rng.normal(0.2 * 15, 1)</li></ul></li>
<li><p>A contractor uses Normal(0, 10) on the log burst rate "to let the data speak". Its prior predictive simulation puts 37% of district-years above 500 bursts. What do you conclude?</p><ul><li><b>A.</b> It is harmless: with 700 counts the data will overwhelm any prior</li><li><b>B.</b> It should be widened further, so that the data alone decide the rates</li><li><b>C.</b> It puts weight on absurd rates; replace it with one that rules them out</li><li><b>D.</b> The simulation is wrong, because a prior cannot predict any data</li></ul></li>
<li><p>Which reason for the prior α ~ Normal(log 0.1, 1) on the log burst rate meets the course's standard?</p><ul><li><b>A.</b> It is weakly informative, so the data rather than the analyst decide the posterior</li><li><b>B.</b> It is the library's default prior, which its authors have tested on many count models</li><li><b>C.</b> It matches the engineers' one burst per 10 km a year, and 73% of its simulated network totals fall in their range</li><li><b>D.</b> It gave the best fit to the five years of observed counts, so the data themselves support it</li></ul></li>
<li><p>Why can Hamiltonian Monte Carlo explore a posterior with 150 parameters where a random-walk sampler stalls?</p><ul><li><b>A.</b> It evaluates the posterior on a fine grid, so no region of high density is missed</li><li><b>B.</b> It assumes the posterior is normal, which makes 150 parameters as easy as one</li><li><b>C.</b> It discards most of its draws, so that the remaining ones are independent of each other</li><li><b>D.</b> It uses the gradient of the log posterior to make long moves that stay in regions of high density</li></ul></li>
<li><p>In log E[bursts] = log km + α + Xβ, the coefficient of log km is fixed at 1, so exp(β) for asbestos cement is a ratio of burst rates per kilometre-year.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A fit of four chains shows no divergences, bulk ESS of 7 for α and R-hat of 1.60. Three chains have a mean α near -2.41 and the fourth near -1.23. What do you do?</p><ul><li><b>A.</b> Report the pooled mean of the four chains, since averaging cancels the odd chain out</li><li><b>B.</b> Drop the fourth chain as a failed run and report the other three, which agree</li><li><b>C.</b> Treat it as untrustworthy: rerun four chains with full warm-up from dispersed starts, then check again</li><li><b>D.</b> Accept it: with no divergences, the sampler reached every part of the posterior</li></ul></li>
<li><p>Zaina's fit hit the maximum tree depth in a third of its draws, with R-hat 1.002, bulk ESS above 1,400 and no divergences. Juhaina asks whether the numbers can be used. What do you answer?</p><ul><li><b>A.</b> Yes: capped trees cost sampling time, and the mixing diagnostics show the draws are sound</li><li><b>B.</b> No: any warning from the sampler invalidates the fit until it is rerun without one</li><li><b>C.</b> No: capping the tree depth biases the draws, so the fit must be rerun uncapped</li><li><b>D.</b> Only after checking it against a variational approximation of the same model</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Pooling across districts</h2>
<ol>
<li><p>A colleague's fit reports R-hat 1.004 and bulk ESS 900, but 23 divergences. She wants to publish the rate ratios. What do you advise?</p><ul><li><b>A.</b> Not yet: find where the divergences sit and change the model or its form, then refit</li><li><b>B.</b> Publish: R-hat and ESS are fine</li><li><b>C.</b> Run twice as many draws and publish</li><li><b>D.</b> Drop the divergent draws and publish the rest</li></ul></li>
<li><p>D120 is a rural district of 2 km with no burst recorded in five years. What does each model say about its rate?</p><ul><li><b>A.</b> No pooling and complete pooling both give it a rate near zero</li><li><b>B.</b> Partial pooling gives it exactly the common rate</li><li><b>C.</b> No pooling: near zero; complete: the common rate; partial: between, close to the common rate</li><li><b>D.</b> No model can say anything until it has a burst</li></ul></li>
<li><p>After adding material and age, τ fell from 0.56 to 0.41. Nouran asks what that means for a rural asbestos-cement district with 3 recorded bursts.</p><ul><li><b>A.</b> It is now pulled towards the rate predicted for old asbestos-cement networks, and somewhat more strongly</li><li><b>B.</b> It is pooled less because the model now knows more</li><li><b>C.</b> Its own three bursts no longer matter</li><li><b>D.</b> Its rate has fallen by 0.15</li></ul></li>
<li><p>A hierarchical model of 50 small districts gives 60 divergences, all at small τ. What is the best first step?</p><ul><li><b>A.</b> Raise target_accept to 0.99 until the divergences stop</li><li><b>B.</b> Drop the districts with fewer than three bursts</li><li><b>C.</b> Switch to complete pooling, which never diverges</li><li><b>D.</b> Rewrite the district effects in non-centred form and refit</li></ul></li>
<li><p>After adding the reporting term, a rural district without sensors moves from 0.18 to 0.26 bursts per km-year. Juhaina asks what the increase rests on.</p><ul><li><b>A.</b> On the district's own burst counts, which reveal its reporting rate</li><li><b>B.</b> Mainly on the audit prior: the counts cannot separate rate from reporting</li><li><b>C.</b> On the sampler having more draws</li><li><b>D.</b> On an error in the burst register that the model fixed</li></ul></li>
<li><p>An inspectorate has 200 schools; 70 have been inspected once. You must estimate each school's rate of serious findings. Which model lets the data decide how much the schools inspected once borrow from the others?</p><ul><li><b>A.</b> A separate rate for each school</li><li><b>B.</b> One rate for all schools</li><li><b>C.</b> School rates drawn from a common distribution whose spread is estimated</li><li><b>D.</b> A separate rate for each school, with the once-inspected schools removed</li></ul></li>
<li><p>In a partial-pooling model of 140 districts, which district's estimate moves furthest towards the common rate?</p><ul><li><b>A.</b> A 200 km urban district with 90 bursts in five years</li><li><b>B.</b> All move by the same amount, set by τ</li><li><b>C.</b> A 50 km suburban district with 20 bursts</li><li><b>D.</b> A 2 km rural district with 2 bursts in five years</li></ul></li>
<li><p>Your partial-pooling model has no predictors. Rural districts, with old asbestos-cement mains, have few bursts each; most of the network is urban. What should worry you before the estimates feed a re-piping plan?</p><ul><li><b>A.</b> Nothing: partial pooling is the recommended model for unequal groups</li><li><b>B.</b> That rural estimates are shrunk towards a mostly urban rate, which may understate their risk</li><li><b>C.</b> That urban districts are shrunk too much</li><li><b>D.</b> That the sampler will diverge on the rural districts</li></ul></li>
<li><p>Adding pipe material and age to the mean of the district effects reduced τ from 0.56 to 0.41. Which statement follows?</p><ul><li><b>A.</b> They explain about half the between-district variance; districts now shrink towards what their pipes predict</li><li><b>B.</b> The districts are now pooled less, because the model knows more about each of them</li><li><b>C.</b> Material and age are now shown to be causes of bursts, since they reduced the spread</li><li><b>D.</b> The model fits worse, because a smaller τ leaves less room for the districts to differ</li></ul></li>
<li><p>Adding an indicator for rural districts to the model of reported bursts will move the rural estimates towards their true burst rates, because it lets rural districts have their own level.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A centred hierarchical model of 49 small districts reports 59 divergences, all at small values of τ. Why there?</p><ul><li><b>A.</b> Small τ squeezes every district effect into a narrow region, where the tuned step size is far too large</li><li><b>B.</b> The burst records of the districts with small τ contain errors that the sampler cannot fit</li><li><b>C.</b> Small τ shows the prior on τ is too narrow; widening it would remove the divergences</li><li><b>D.</b> The sampler ran out of draws before it could explore the small values of τ</li></ul></li>
<li><p>Raising target_accept to 0.99 removed all divergences of a centred hierarchical model, but R-hat is 1.14. What do you conclude?</p><ul><li><b>A.</b> The fit is now trustworthy</li><li><b>B.</b> Report the fit with a note about R-hat</li><li><b>C.</b> Run more chains until R-hat falls below 1.01 by chance</li><li><b>D.</b> The chains still disagree; rewrite the model in non-centred form</li></ul></li>
<li><p>The centred and non-centred forms of a hierarchical model describe the same joint distribution of the data and the parameters.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>In the model with a reporting share for districts without sensors, the posterior of the reporting share is almost identical to its Beta(14, 6) prior. What does that mean?</p><ul><li><b>A.</b> The model failed to converge for the reporting share and must be refitted with more draws</li><li><b>B.</b> The prior was too wide for the data to move it, and a narrower prior would fix this</li><li><b>C.</b> The reporting share is now known to be exactly 0.70 in every district without sensors</li><li><b>D.</b> The counts cannot separate rate from reporting share, so the audit behind the prior carries the correction</li></ul></li>
<li><p>Bursts in districts without sensors are reported with probability p. Which likelihood for the reported count y of district j in a year follows?</p><ul><li><b>A.</b> y ~ Poisson(km_j × rate_j)</li><li><b>B.</b> y ~ Poisson(km_j × rate_j × p_j)</li><li><b>C.</b> y ~ Poisson(km_j × rate_j) × p_j</li><li><b>D.</b> y ~ Poisson(km_j × rate_j / p_j)</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Is the model good enough</h2>
<ol>
<li><p>A rural district of 1.5 km recorded one burst in five years. Its posterior rate under the Lab 2.4 model is 0.21. What contributes most to that number?</p><ul><li><b>A.</b> Its own record: 1 burst over 7.5 km-years</li><li><b>B.</b> The rate predicted for its material and age, plus the audit prior on reporting</li><li><b>C.</b> The sampler's starting values</li><li><b>D.</b> The common rate of all 140 districts</li></ul></li>
<li><p>Shabib proposes checking the Poisson model on the total number of bursts per year across the network. What do you tell him?</p><ul><li><b>A.</b> The model was fitted to reproduce totals; check the variation within districts from year to year instead</li><li><b>B.</b> A good check: if the totals match, the model fits</li><li><b>C.</b> Checks are only valid on data the model has not seen</li><li><b>D.</b> If p is near 0.5 the model is proven correct</li></ul></li>
<li><p>Model A has elpd -1,402 (SE 35) and model B -1,408 (SE 36). The difference is 6 with a standard error of 5. Juhaina asks which to use.</p><ul><li><b>A.</b> A: it has the higher elpd</li><li><b>B.</b> Neither can be told apart because 6 is small next to 35</li><li><b>C.</b> No clear winner on prediction: choose by the checks, simplicity and what the decision needs</li><li><b>D.</b> The one with more parameters</li></ul></li>
<li><p>In a calibration of 200 simulations, a parameter's ranks form a hump: few near 0 or 99, many in the middle. What does it say?</p><ul><li><b>A.</b> The posterior is approximately normal, as expected</li><li><b>B.</b> The posterior is too narrow</li><li><b>C.</b> The posterior is too wide: the truth sits near its middle too often</li><li><b>D.</b> The sampler needs more warm-up</li></ul></li>
<li><p>Power-scaling shows that no quantity shifts by more than 0.03 posterior sd. Nouran asks whether the priors can now be ignored in the memo.</p><ul><li><b>A.</b> Yes: the analysis is insensitive to its priors</li><li><b>B.</b> Yes, and the analysis could have used maximum likelihood instead</li><li><b>C.</b> No: sensitivity cannot be known until new data arrive</li><li><b>D.</b> No: state the priors tested, and name the reporting prior, which the data cannot check</li></ul></li>
<li><p>A Poisson model of daily ambulance calls per station is fitted. Which posterior predictive check is most likely to reveal a problem the fit itself could hide?</p><ul><li><b>A.</b> The total number of calls over the year, across all stations together</li><li><b>B.</b> The mean number of calls per station, compared station by station</li><li><b>C.</b> The variance of each station's daily calls divided by their mean</li><li><b>D.</b> The number of stations that received at least one call in the year</li></ul></li>
<li><p>A posterior predictive check of the share of zero counts gives p = 0.12. What does this say?</p><ul><li><b>A.</b> The model is wrong with 88% probability, so it should be replaced</li><li><b>B.</b> The check failed and must be repeated with more posterior draws</li><li><b>C.</b> The model is right with 12% probability, which is too low to use it</li><li><b>D.</b> The observed share sits within the range the model produces, towards its edge</li></ul></li>
<li><p>A negative binomial with mean 4 and shape φ = 8 replaces a Poisson with mean 4. What is the variance of each?</p><ul><li><b>A.</b> Poisson 4, negative binomial 6</li><li><b>B.</b> Both 4</li><li><b>C.</b> Poisson 4, negative binomial 32</li><li><b>D.</b> Poisson 16, negative binomial 6</li></ul></li>
<li><p>Two models of clinic waiting times: elpd -2,150 (SE 40) and -2,180 (SE 42); the difference is 30 with a standard error of 8. Which reading is right?</p><ul><li><b>A.</b> No clear difference, because 30 is smaller than either model's own SE</li><li><b>B.</b> The comparison is invalid unless both models have the same number of parameters</li><li><b>C.</b> The second predicts better, because its larger SE means it captures more variation</li><li><b>D.</b> The first predicts held-out patients better: the difference is almost four of its own standard errors</li></ul></li>
<li><p>Leave-one-out flags one school-year with Pareto k = 1.1: a fire closed the school for a term and inspections found many problems. What should the analyst do first?</p><ul><li><b>A.</b> Delete the school-year: an event that rare should not drive the model's choice</li><li><b>B.</b> Confirm what happened, keep the real event, and prefer a model that such years do not overturn</li><li><b>C.</b> Ignore it: one school-year cannot matter much among 800 observations</li><li><b>D.</b> Raise the number of posterior draws until the Pareto k falls below 0.7</li></ul></li>
<li><p>A report justifies a model by an R² of 0.91 between observed and fitted counts. Why is this weak evidence?</p><ul><li><b>A.</b> R² cannot be computed for counts</li><li><b>B.</b> It rewards fitting the data already seen; a model with more parameters always scores higher</li><li><b>C.</b> 0.91 is too low for count data</li><li><b>D.</b> R² is a frequentist measure and cannot be used with a Bayesian model</li></ul></li>
<li><p>In a simulation-based calibration, a parameter's rank histogram rises steadily from left to right. What does it indicate?</p><ul><li><b>A.</b> The posterior is too wide, so the truth sits near its middle too often</li><li><b>B.</b> The code is correct, since the ranks cover the whole range from 0 to 99</li><li><b>C.</b> The sampler needs more chains, because the ranks have not yet mixed</li><li><b>D.</b> The posterior sits below the truth: the truth's rank is usually high</li></ul></li>
<li><p>A colleague simulated one dataset from known parameters, fitted her model and recovered both inside their 90% intervals. She says the code is verified. What is the best reply?</p><ul><li><b>A.</b> Agreed: recovering both parameters from known values is the standard test</li><li><b>B.</b> Not yet: repeat it with a larger dataset, and then the code is verified</li><li><b>C.</b> One run can pass by luck; rank the truth over many simulated datasets and check the ranks are uniform</li><li><b>D.</b> Verification is impossible for Bayesian models, so a plausible fit must do</li></ul></li>
<li><p>A model passes simulation-based calibration. Which error could it still contain?</p><ul><li><b>A.</b> A prior written with a variance where the scale belongs, in the model only</li><li><b>B.</b> A likelihood that assumes Poisson counts when the real data are overdispersed</li><li><b>C.</b> A wrong parameterisation of the negative binomial in the model only</li><li><b>D.</b> A sampler that cannot reach part of the posterior</li></ul></li>
<li><p>Power-scaling the priors by 0.8 and 1.25 moves the posterior mean of a district's rate by 0.6 posterior standard deviations. What does that suggest?</p><ul><li><b>A.</b> The prior does much of the work for this quantity: report it and test alternative priors</li><li><b>B.</b> The data dominate the priors for this quantity, since the shift is below one sd</li><li><b>C.</b> The sampler has not converged, because the mean moves when the prior changes</li><li><b>D.</b> The rate is unreliable and must be removed from the report to Nouran</li></ul></li>
<li><p>Three priors on the spread between districts give the same 15 riskiest districts, but the reporting share of districts without sensors comes only from an audit-based prior. What belongs in the memo?</p><ul><li><b>A.</b> That the results are robust to the priors, as the three spread priors showed</li><li><b>B.</b> Nothing about priors: the director needs the plan, not the modelling choices</li><li><b>C.</b> The spread prior does not change the plan; the reporting prior carries the rural estimates and rests on one audit</li><li><b>D.</b> Replace the reporting prior with a flat one, so that the memo is objective</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: From posterior to decision</h2>
<ol>
<li><p>Day 4 uses the hierarchical negative binomial with the reporting term. Which piece of yesterday's evidence would most change today's plan had it gone the other way?</p><ul><li><b>A.</b> The replicated network total matching 3,894 bursts</li><li><b>B.</b> The power-scaling of the prior on τ</li><li><b>C.</b> The dispersion check: a Poisson would make every district look more certain than it is</li><li><b>D.</b> The calibration of the colleague's model</li></ul></li>
<li><p>An extra cost applies only when a district exceeds 40 bursts in a year: a fine from the regulator. Does deciding on the posterior mean rate still give the expected-utility choice?</p><ul><li><b>A.</b> Yes: the mean plug-in is always the same as expected utility</li><li><b>B.</b> Not in general: the fine is not linear in the rate, so its expectation depends on the whole posterior</li><li><b>C.</b> No, but the median plug-in would</li><li><b>D.</b> No decision can be made with a threshold cost</li></ul></li>
<li><p>District A: repair costs 1 million and saves 1.5 million; re-piping costs 10 million and saves 4 million in all. Funds are short. Which step is ranked by which ratio?</p><ul><li><b>A.</b> Re-pipe at 0.4 per riyal, as one step</li><li><b>B.</b> Only the repair is ever considered</li><li><b>C.</b> Re-pipe first because it saves the most</li><li><b>D.</b> Repair at 1.5 per riyal; then the upgrade to re-pipe at 2.5 / 9 ≈ 0.28 per riyal</li></ul></li>
<li><p>Two districts without sensors. X: rate very uncertain, but re-piping is best in every draw. Y: rate moderately uncertain, and repair or wait each wins in about half the draws. Where is a survey worth more?</p><ul><li><b>A.</b> Y: the survey can change its decision; X's decision is already settled</li><li><b>B.</b> X: it is the more uncertain</li><li><b>C.</b> Both the same: a survey costs the same in each</li><li><b>D.</b> Neither: surveys only confirm a model</li></ul></li>
<li><p>Which sentence is a usable review finding?</p><ul><li><b>A.</b> The priors are not good enough</li><li><b>B.</b> The report uses Normal(0, 100)</li><li><b>C.</b> Each district is estimated alone, so D073 (a few bursts on a short network) ranks third; pooled, its rate halves and it leaves the list</li><li><b>D.</b> The analysis should have used NumPyro</li></ul></li>
<li><p>You have 2,000 posterior draws of each clinic's demand and a cost for each of three staffing options in each draw. How do you choose an option for a clinic by expected utility?</p><ul><li><b>A.</b> Average each option's cost over the draws, then choose the option with the lowest average</li><li><b>B.</b> Choose the best option in each draw, then take the option chosen most often</li><li><b>C.</b> Compute the cost at the posterior median demand and choose</li><li><b>D.</b> Choose the option whose cost varies least across draws</li></ul></li>
<li><p>Every cost in a decision is a straight line in an uncertain rate. Which plug-in estimate gives the same choice as expected utility?</p><ul><li><b>A.</b> The posterior median</li><li><b>B.</b> The posterior mode</li><li><b>C.</b> The posterior mean</li><li><b>D.</b> The upper end of the 90% interval</li></ul></li>
<li><p>A 5 km district has a rate of 0.2 bursts per km-year. A burst costs SAR 80,000; over 20 years, repair costs SAR 40,000 per km and removes 30% of bursts for 10 years. What is the expected cost of repairing?</p><ul><li><b>A.</b> SAR 1.36 million</li><li><b>B.</b> SAR 1.60 million</li><li><b>C.</b> SAR 1.32 million</li><li><b>D.</b> SAR 1.56 million</li></ul></li>
<li><p>A school can get a short visit (SAR 9,000, value 20,000) or a full audit (SAR 30,000, value 35,000 in all). Under a tight budget, how should the audit be ranked against other schools' options?</p><ul><li><b>A.</b> By its whole ratio, 35,000 / 30,000 ≈ 1.17 per riyal, like any other option</li><li><b>B.</b> By its total value of 35,000, since the audit gives the most value of the two</li><li><b>C.</b> By the extra 15,000 for the extra 21,000: about 0.71 per riyal, after the visit</li><li><b>D.</b> It should never be considered, because a tight budget allows only short visits</li></ul></li>
<li><p>How is the 90% interval of bursts avoided by a fixed plan obtained from the posterior?</p><ul><li><b>A.</b> By applying the same plan in every posterior draw and taking quantiles of the avoided bursts</li><li><b>B.</b> From the standard error of the mean rate times the network length</li><li><b>C.</b> By refitting the model with the plan's districts removed</li><li><b>D.</b> By adding the intervals of the funded districts</li></ul></li>
<li><p>A capital plan funds 43 districts. What else should the decision memo state about the districts it does not fund?</p><ul><li><b>A.</b> Nothing: districts outside the plan are outside the memo's question</li><li><b>B.</b> Their names only, listed in an annex for completeness</li><li><b>C.</b> Their expected bursts, who bears them, and which districts the model knows least about</li><li><b>D.</b> That they are safe until the next budget, as their expected costs are lower</li></ul></li>
<li><p>Perfect information on all 76 districts is worth SAR 2.4 million. A survey of all 76 costs SAR 3.4 million. What follows before simulating the survey?</p><ul><li><b>A.</b> The survey might still be worth buying if its error is small</li><li><b>B.</b> The full survey is not worth its price: no real survey is worth more than perfect information</li><li><b>C.</b> The survey must be bought to know its value</li><li><b>D.</b> Perfect information is impossible, so the comparison is meaningless</li></ul></li>
<li><p>For which district is a survey of its true burst rate worth most to a re-piping decision?</p><ul><li><b>A.</b> One with a very uncertain rate whose best action is the same in every draw</li><li><b>B.</b> One with a rate known precisely</li><li><b>C.</b> One near the threshold between two actions, with a moderately uncertain rate</li><li><b>D.</b> The largest district, whatever its rate</li></ul></li>
<li><p>In a preposterior analysis of a survey with 15% error, what is simulated for each posterior draw?</p><ul><li><b>A.</b> A new model fit with more chains, to see how the posterior would move</li><li><b>B.</b> The survey's price under different budgets, to find the affordable size</li><li><b>C.</b> A replicated dataset of past bursts, as in a posterior predictive check</li><li><b>D.</b> The survey's report if that draw's rate were true, the updated choice, and its cost under that truth</li></ul></li>
<li><p>Which is the most useful finding in a review of a Bayesian analysis?</p><ul><li><b>A.</b> Two chains and R-hat judged against 1.1: the fit is not shown trustworthy, so its ranking cannot be used yet</li><li><b>B.</b> The model is too simple for a network of 140 districts and should be extended</li><li><b>C.</b> The author should have used Stan or NumPyro instead of the package they chose</li><li><b>D.</b> The priors look arbitrary and are not explained anywhere in the report</li></ul></li>
<li><p>A report estimates each district alone and also ran two chains with 37 divergences. Which flaw is likely to change the list of districts most, and why?</p><ul><li><b>A.</b> The divergences: any computational warning invalidates everything equally</li><li><b>B.</b> Estimating districts alone: small districts reach the top on noise even if the computation were perfect</li><li><b>C.</b> Both equally: flaws cannot be ranked</li><li><b>D.</b> Neither: the list is what the data say</li></ul></li>
<li><p>A consultant declares 13 districts with no recorded burst in five years safe. Which two checklist items does the reviewer cite?</p><ul><li><b>A.</b> Priors and computation: a flat prior and too few chains</li><li><b>B.</b> Checking and decision: no predictive check and no costs</li><li><b>C.</b> Computation and checking: divergences and R² taken as fit</li><li><b>D.</b> Structure (no pooling) and measurement (unrecorded bursts)</li></ul></li>
</ol>

unit":null,"explanation":"Twice the kilometres at the same rate gives twice the expected bursts; the other coefficients then describe a rate per kilometre-year.","misconceptions":["","Believes length has no effect on bursts, which the stretch item disproves","Mistakes an offset for a computational shortcut","Confuses a fixed coefficient with a prior centred on 1"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-offset","title":"The offset"},"level":null,"pool":"checkpoint"},{"id":"check-diagnostics-q1","type":"single","prompt":"A fit reports R-hat 1.003, bulk ESS 2,100, no divergences, and 40% of draws at the maximum tree depth. Another reports no divergences and R-hat 1.21. Which do you send back?","options":[{"key":"A","text":"The first, because 40% of trees are capped"},{"key":"B","text":"Neither, because neither has divergences"},{"key":"C","text":"Both, because each has a warning"},{"key":"D","text":"The second, because its chains disagree"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An R-hat of 1.21 means the chains explore different distributions; capped trees in the first fit cost time but its chains mixed.","misconceptions":["Treats an efficiency warning as a validity failure","Assumes a fit is sound whenever no divergence is reported","Lets one warning disqualify a fit whose mixing is sound",""],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-diagnostics","title":"Which fit to send back"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"A colleague's fit reports R-hat 1.004 and bulk ESS 900, but 23 divergences. She wants to publish the rate ratios. What do you advise?","options":[{"key":"A","text":"Not yet: find where the divergences sit and change the model or its form, then refit"},{"key":"B","text":"Publish: R-hat and ESS are fine"},{"key":"C","text":"Run twice as many draws and publish"},{"key":"D","text":"Drop the divergent draws and publish the rest"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Divergences mean part of the posterior was not reached; the summaries can be biased whatever R-hat says. Session 3 shows the usual cause and the fix.","misconceptions":["","Lets good mixing numbers excuse a validity warning","Treats divergences as noise that more draws average away","Discards the evidence instead of fixing its cause"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Before reading a fit"},"level":null,"pool":"checkpoint"},{"id":"check-pooling-q1","type":"single","prompt":"D120 is a rural district of 2 km with no burst recorded in five years. What does each model say about its rate?","options":[{"key":"A","text":"No pooling and complete pooling both give it a rate near zero"},{"key":"B","text":"Partial pooling gives it exactly the common rate"},{"key":"C","text":"No pooling: near zero; complete: the common rate; partial: between, close to the common rate"},{"key":"D","text":"No model can say anything until it has a burst"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With little data, partial pooling leans heavily on the population, but its own zero still pulls it a little below the common rate.","misconceptions":["Thinks complete pooling responds to the district's own record","Confuses shrinkage with ignoring the district's data","","Believes a zero count cannot be modelled"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-pooling","title":"A district with no recorded burst"},"level":null,"pool":"checkpoint"},{"id":"check-predictors-q1","type":"single","prompt":"After adding material and age, τ fell from 0.56 to 0.41. Nouran asks what that means for a rural asbestos-cement district with 3 recorded bursts.","options":[{"key":"A","text":"It is now pulled towards the rate predicted for old asbestos-cement networks, and somewhat more strongly"},{"key":"B","text":"It is pooled less because the model now knows more"},{"key":"C","text":"Its own three bursts no longer matter"},{"key":"D","text":"Its rate has fallen by 0.15"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The target of the shrinkage is now a prediction from its pipes; a smaller τ means districts sit closer to their predictions, so a district with little data is pulled more firmly towards a better target.","misconceptions":["","Reads a smaller spread as less pooling, the reverse of what it implies","Thinks predictors replace the district's own data","Confuses a fall in τ with a change in the data"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-predictors","title":"What τ means now"},"level":null,"pool":"checkpoint"},{"id":"check-funnel-q1","type":"single","prompt":"A hierarchical model of 50 small districts gives 60 divergences, all at small τ. What is the best first step?","options":[{"key":"A","text":"Raise target_accept to 0.99 until the divergences stop"},{"key":"B","text":"Drop the districts with fewer than three bursts"},{"key":"C","text":"Switch to complete pooling, which never diverges"},{"key":"D","text":"Rewrite the district effects in non-centred form and refit"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Divergences at small τ are the funnel of the centred form; the non-centred form removes the funnel without changing the model.","misconceptions":["Treats the symptom: fewer divergences, same bias","Removes the districts that need the model most","Changes what the model claims to avoid a computational problem",""],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-funnel","title":"A divergent hierarchical model"},"level":null,"pool":"checkpoint"},{"id":"check-reporting-q1","type":"single","prompt":"After adding the reporting term, a rural district without sensors moves from 0.18 to 0.26 bursts per km-year. Juhaina asks what the increase rests on.","options":[{"key":"A","text":"On the district's own burst counts, which reveal its reporting rate"},{"key":"B","text":"Mainly on the audit prior: the counts cannot separate rate from reporting"},{"key":"C","text":"On the sampler having more draws"},{"key":"D","text":"On an error in the burst register that the model fixed"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Only rate times reporting share reaches the counts; the split between them comes from the audit-based prior.","misconceptions":["Thinks the model measured the district's own reporting","","Attributes the change to the sampler","Reads the change as a fault in the data rather than in the earlier model"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-reporting","title":"Reading the correction"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"A rural district of 1.5 km recorded one burst in five years. Its posterior rate under the Lab 2.4 model is 0.21. What contributes most to that number?","options":[{"key":"A","text":"Its own record: 1 burst over 7.5 km-years"},{"key":"B","text":"The rate predicted for its material and age, plus the audit prior on reporting"},{"key":"C","text":"The sampler's starting values"},{"key":"D","text":"The common rate of all 140 districts"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"With so little data the district borrows almost everything: from the prediction for its pipes (Lab 2.2) and, without sensors, from the reporting prior (Lab 2.4).","misconceptions":["Overweights a single recorded burst over the population it is pooled with","","Thinks the sampler, not the model, chooses the estimate","Thinks the common rate is still the pooling target after predictors were added"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"What a pooled estimate rests on"},"level":null,"pool":"checkpoint"},{"id":"check-ppc-q1","type":"single","prompt":"Shabib proposes checking the Poisson model on the total number of bursts per year across the network. What do you tell him?","options":[{"key":"A","text":"The model was fitted to reproduce totals; check the variation within districts from year to year instead"},{"key":"B","text":"A good check: if the totals match, the model fits"},{"key":"C","text":"Checks are only valid on data the model has not seen"},{"key":"D","text":"If p is near 0.5 the model is proven correct"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A statistic the fit already matches cannot fail; choose one that the decision depends on and the fit does not force.","misconceptions":["","Assumes any check that passes shows the model fits","Thinks checks must use held-out data, confusing them with cross-validation","Treats a p-value near 0.5 as proof rather than as no evidence against"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-ppc","title":"Choosing a test statistic"},"level":null,"pool":"checkpoint"},{"id":"check-loo-q1","type":"single","prompt":"Model A has elpd -1,402 (SE 35) and model B -1,408 (SE 36). The difference is 6 with a standard error of 5. Juhaina asks which to use.","options":[{"key":"A","text":"A: it has the higher elpd"},{"key":"B","text":"Neither can be told apart because 6 is small next to 35"},{"key":"C","text":"No clear winner on prediction: choose by the checks, simplicity and what the decision needs"},{"key":"D","text":"The one with more parameters"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A difference within about two of its own standard errors is not decisive; other evidence has to choose.","misconceptions":["Treats any positive difference as a meaningful win","Compares the difference with each model's own SE instead of the SE of the difference","","Thinks more parameters always means a better model"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-loo","title":"Reading a model comparison"},"level":null,"pool":"checkpoint"},{"id":"check-sbc-q1","type":"single","prompt":"In a calibration of 200 simulations, a parameter's ranks form a hump: few near 0 or 99, many in the middle. What does it say?","options":[{"key":"A","text":"The posterior is approximately normal, as expected"},{"key":"B","text":"The posterior is too narrow"},{"key":"C","text":"The posterior is too wide: the truth sits near its middle too often"},{"key":"D","text":"The sampler needs more warm-up"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A right posterior puts the truth anywhere among its draws equally often; a too-wide one rarely puts it in the tails.","misconceptions":["Reads the hump as the shape of a posterior, not of a rank histogram","Confuses the hump with the U shape","","Thinks calibration measures the sampler's speed"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-sbc","title":"Reading rank histograms"},"level":null,"pool":"checkpoint"},{"id":"check-sensitivity-q1","type":"single","prompt":"Power-scaling shows that no quantity shifts by more than 0.03 posterior sd. Nouran asks whether the priors can now be ignored in the memo.","options":[{"key":"A","text":"Yes: the analysis is insensitive to its priors"},{"key":"B","text":"Yes, and the analysis could have used maximum likelihood instead"},{"key":"C","text":"No: sensitivity cannot be known until new data arrive"},{"key":"D","text":"No: state the priors tested, and name the reporting prior, which the data cannot check"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Robustness holds for the priors the data inform; a prior the data cannot check carries its answer and must be stated with its source.","misconceptions":["Generalises from the priors that were tested to all of them","Treats robustness as a reason to drop the Bayesian analysis","Assumes sensitivity can only be shown with new data",""],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-sensitivity","title":"Reporting sensitivity"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"Day 4 uses the hierarchical negative binomial with the reporting term. Which piece of yesterday's evidence would most change today's plan had it gone the other way?","options":[{"key":"A","text":"The replicated network total matching 3,894 bursts"},{"key":"B","text":"The power-scaling of the prior on τ"},{"key":"C","text":"The dispersion check: a Poisson would make every district look more certain than it is"},{"key":"D","text":"The calibration of the colleague's model"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The dispersion decides how wide every district's interval is, and today's decisions and the survey's value both depend on that width.","misconceptions":["Picks a check the fit forces, which could not have gone the other way","Picks the prior that the data dominate","","Confuses a check of the code with a check of the model against the world"],"lo":["LO3"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"What the model choice rests on"},"level":null,"pool":"checkpoint"},{"id":"check-eu-q1","type":"single","prompt":"An extra cost applies only when a district exceeds 40 bursts in a year: a fine from the regulator. Does deciding on the posterior mean rate still give the expected-utility choice?","options":[{"key":"A","text":"Yes: the mean plug-in is always the same as expected utility"},{"key":"B","text":"Not in general: the fine is not linear in the rate, so its expectation depends on the whole posterior"},{"key":"C","text":"No, but the median plug-in would"},{"key":"D","text":"No decision can be made with a threshold cost"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The expectation of a straight line is the line at the mean; for a threshold, the probability of crossing it comes from the posterior's tail.","misconceptions":["Generalises from linear costs t
