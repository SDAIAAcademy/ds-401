cision.","misconceptions":["","Equates value of information with uncertainty alone","Thinks information always has the same value","Thinks a settled decision needs confirming"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-voi","title":"Which district to survey"},"level":null,"pool":"checkpoint"},{"id":"check-review-q1","type":"single","prompt":"Which sentence is a usable review finding?","options":[{"key":"A","text":"The priors are not good enough"},{"key":"B","text":"The report uses Normal(0, 100)"},{"key":"C","text":"Each district is estimated alone, so D073 (a few bursts on a short network) ranks third; pooled, its rate halves and it leaves the list"},{"key":"D","text":"The analysis should have used NumPyro"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A finding quotes what the report did, shows the evidence, and says how it changes the decision.","misconceptions":["States an opinion without the evidence or the consequence","Names the evidence but not what it does to the decision","","Prescribes a tool instead of identifying a flaw"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-review","title":"Writing one finding"},"level":null,"pool":"checkpoint"},{"id":"q-grid-width","type":"single","prompt":"Shabib asks why the posterior of a 2 km rural district spans rates from 0.06 to 0.5 bursts per km-year, while a 180 km urban district's spans 0.07 to 0.10, although both used the same prior and five years of data. What is the reason?","options":[{"key":"A","text":"Its few bursts give a flat likelihood, so the prior shapes much of its posterior"},{"key":"B","text":"The rural district's prior was set wider, because rural rates are known to vary more"},{"key":"C","text":"The sampler mixed worse for the rural district, which widens its interval"},{"key":"D","text":"Rural rates vary more from year to year by nature, whatever the data say"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Exposure of 10 km-years holds a handful of bursts, which constrains the rate weakly; 900 km-years constrain it sharply.","misconceptions":["","Thinks different widths require different priors, when the same prior was used","Blames the computation for what is a property of the data","Confuses uncertainty about a rate with variability of the process"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"small-and-large","title":"Five years say little about a 1.2 km district"},"level":"understand","pool":"practice"},{"id":"q-generative-exposure","type":"single","prompt":"You simulate a year of bursts for a district with a rate of 0.2 bursts per km-year and 15 km of mains. Which line simulates one year?","options":[{"key":"A","text":"rng.poisson(0.2)"},{"key":"B","text":"rng.poisson(0.2 * 15)"},{"key":"C","text":"rng.poisson(0.2) * 15"},{"key":"D","text":"rng.normal(0.2 * 15, 1)"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The expected count is the rate times the exposure, 3 bursts, and the count is a Poisson draw with that mean.","misconceptions":["Forgets the exposure: the rate is per kilometre","","Scales a count drawn for one kilometre, which gives only multiples of 15","Uses a continuous distribution for a count that cannot be negative or fractional"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"generative-story","title":"Write the story that produces the bursts, then run it forwards"},"level":"apply","pool":"practice"},{"id":"q-flat-prior","type":"single","prompt":"A contractor uses Normal(0, 10) on the log burst rate \"to let the data speak\". Its prior predictive simulation puts 37% of district-years above 500 bursts. What do you conclude?","options":[{"key":"A","text":"It is harmless: with 700 counts the data will overwhelm any prior"},{"key":"B","text":"It should be widened further, so that the data alone decide the rates"},{"key":"C","text":"It puts weight on absurd rates; replace it with one that rules them out"},{"key":"D","text":"The simulation is wrong, because a prior cannot predict any data"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A prior that predicts impossible data carries strong, wrong information; with little data, as in small districts, it moves the posterior.","misconceptions":["Assumes data always dominate, which fails for districts with few bursts","Believes wider is always more neutral","","Does not know that a prior and a likelihood together imply a distribution of data"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"flat-not-harmless","title":"The \"harmless\" flat prior predicts impossible district-years"},"level":"analyze","pool":"practice"},{"id":"q-prior-reason","type":"single","prompt":"Which reason for the prior α ~ Normal(log 0.1, 1) on the log burst rate meets the course's standard?","options":[{"key":"A","text":"It is weakly informative, so the data rather than the analyst decide the posterior"},{"key":"B","text":"It is the library's default prior, which its authors have tested on many count models"},{"key":"C","text":"It matches the engineers' one burst per 10 km a year, and 73% of its simulated network totals fall in their range"},{"key":"D","text":"It gave the best fit to the five years of observed counts, so the data themselves support it"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A reason quotes the knowledge the prior encodes and a check of what it predicts.","misconceptions":["Gives a label in place of a reason","Defers to software defaults that know nothing of pipes","","Tunes the prior to the same data the model will fit, using the data twice"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"reason-per-prior","title":"Every prior in the notebook carries one sentence of reason"},"level":"evaluate","pool":"practice"},{"id":"q-hmc-gradient","type":"single","prompt":"Why can Hamiltonian Monte Carlo explore a posterior with 150 parameters where a random-walk sampler stalls?","options":[{"key":"A","text":"It evaluates the posterior on a fine grid, so no region of high density is missed"},{"key":"B","text":"It assumes the posterior is normal, which makes 150 parameters as easy as one"},{"key":"C","text":"It discards most of its draws, so that the remaining ones are independent of each other"},{"key":"D","text":"It uses the gradient of the log posterior to make long moves that stay in regions of high density"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Momentum and the gradient carry the sampler far in one iteration along the shape of the posterior, so proposals are accepted often even in many dimensions.","misconceptions":["Confuses sampling with grid evaluation, which is impossible in 150 dimensions","Confuses HMC with a normal approximation","Mistakes thinning for what makes a sampler efficient",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"hmc-intuition","title":"HMC rolls a particle across the posterior using its gradient"},"level":"understand","pool":"practice"},{"id":"q-offset-meaning","type":"tf","prompt":"In log E[bursts] = log km + α + Xβ, the coefficient of log km is fixed at 1, so exp(β) for asbestos cement is a ratio of burst rates per kilometre-year.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"With the offset, the other terms model the rate per unit of exposure.","misconceptions":["","Thinks the material coefficient compares total counts, which would mix material with network length"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-offset","title":"The offset"},"level":"understand","pool":"practice"},{"id":"q-rhat-no-divergence","type":"single","prompt":"A fit of four chains shows no divergences, bulk ESS of 7 for α and R-hat of 1.60. Three chains have a mean α near -2.41 and the fourth near -1.23. What do you do?","options":[{"key":"A","text":"Report the pooled mean of the four chains, since averaging cancels the odd chain out"},{"key":"B","text":"Drop the fourth chain as a failed run and report the other three, which agree"},{"key":"C","text":"Treat it as untrustworthy: rerun four chains with full warm-up from dispersed starts, then check again"},{"key":"D","text":"Accept it: with no divergences, the sampler reached every part of the posterior"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Chains that disagree have not converged to one distribution; only a fresh run that passes the checks can be read.","misconceptions":["Averages over chains that sample different things","Discards evidence of a problem without knowing which chains are right","","Treats the absence of divergences as proof of convergence"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"rhat-story","title":"No divergence, and still one chain is somewhere else"},"level":"analyze","pool":"practice"},{"id":"q-capped-trees","type":"single","prompt":"Zaina's fit hit the maximum tree depth in a third of its draws, with R-hat 1.002, bulk ESS above 1,400 and no divergences. Juhaina asks whether the numbers can be used. What do you answer?","options":[{"key":"A","text":"Yes: capped trees cost sampling time, and the mixing diagnostics show the draws are sound"},{"key":"B","text":"No: any warning from the sampler invalidates the fit until it is rerun without one"},{"key":"C","text":"No: capping the tree depth biases the draws, so the fit must be rerun uncapped"},{"key":"D","text":"Only after checking it against a variational approximation of the same model"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Tree depth is an efficiency diagnostic; validity is judged by R-hat, ESS, divergences and E-BFMI, which all pass.","misconceptions":["","Treats every warning as a validity failure","Confuses a slow setting with a wrong one","Thinks an approximation is more reliable than a sound sampler"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"efficiency-validity","title":"A capped tree costs time; it does not make the draws wrong"},"level":"evaluate","pool":"practice"},{"id":"q-pooling-choice","type":"single","prompt":"An inspectorate has 200 schools; 70 have been inspected once. You must estimate each school's rate of serious findings. Which model lets the data decide how much the schools inspected once borrow from the others?","options":[{"key":"A","text":"A separate rate for each school"},{"key":"B","text":"One rate for all schools"},{"key":"C","text":"School rates drawn from a common distribution whose spread is estimated"},{"key":"D","text":"A separate rate for each school, with the once-inspected schools removed"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Partial pooling estimates the spread between schools, and each school's estimate borrows in proportion to how little data it has.","misconceptions":["Trusts one inspection as much as five, so once-inspected schools get extreme estimates","Assumes all schools are alike, which the analyst decides rather than the data","","Throws away the schools that most need an estimate"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"three-poolings","title":"No pooling trusts each district; complete pooling trusts none"},"level":"apply","pool":"practice"},{"id":"q-shrinkage-who","type":"single","prompt":"In a partial-pooling model of 140 districts, which district's estimate moves furthest towards the common rate?","options":[{"key":"A","text":"A 200 km urban district with 90 bursts in five years"},{"key":"B","text":"All move by the same amount, set by τ"},{"key":"C","text":"A 50 km suburban district with 20 bursts"},{"key":"D","text":"A 2 km rural district with 2 bursts in five years"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Shrinkage depends on how much information a district's own data carry; 2 bursts carry little, so the population dominates.","misconceptions":["Thinks large districts are pulled most because they dominate the average","Believes τ shrinks every district equally regardless of its data","Picks a middle case without reasoning about information",""],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"shrinkage-by-kind","title":"Rural districts borrow most of their estimate; urban ones keep their own"},"level":"understand","pool":"practice"},{"id":"q-rural-pull","type":"single","prompt":"Your partial-pooling model has no predictors. Rural districts, with old asbestos-cement mains, have few bursts each; most of the network is urban. What should worry you before the estimates feed a re-piping plan?","options":[{"key":"A","text":"Nothing: partial pooling is the recommended model for unequal groups"},{"key":"B","text":"That rural estimates are shrunk towards a mostly urban rate, which may understate their risk"},{"key":"C","text":"That urban districts are shrunk too much"},{"key":"D","text":"That the sampler will diverge on the rural districts"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Shrinkage pulls small districts towards the population mean; if that mean is dominated by a different kind of district, their risk is understated systematically.","misconceptions":["Treats a method's standard status as a defence of its effect on a specific group","","Reverses who is shrunk: large districts keep their own estimates","Confuses a statistical bias with a computational problem"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"rural-pull","title":"Pooling towards one rate hides how much riskier the rural districts are"},"level":"evaluate","pool":"practice"},{"id":"q-group-predictor","type":"single","prompt":"Adding pipe material and age to the mean of the district effects reduced τ from 0.56 to 0.41. Which statement follows?","options":[{"key":"A","text":"They explain about half the between-district variance; districts now shrink towards what their pipes predict"},{"key":"B","text":"The districts are now pooled less, because the model knows more about each of them"},{"key":"C","text":"Material and age are now shown to be causes of bursts, since they reduced the spread"},{"key":"D","text":"The model fits worse, because a smaller τ leaves less room for the districts to differ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"1 - 0.41²/0.56² is about 0.47; with predictors the shrinkage target is the predicted rate for each district.","misconceptions":["","Reads a smaller spread as weaker pooling","Reads an association in observational data as a proven cause","Thinks a smaller unexplained spread is a worse fit"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"shrink-to-prediction","title":"Shrink each district towards what its pipes predict, not towards the average"},"level":"apply","pool":"practice"},{"id":"q-proxy-predictor","type":"tf","prompt":"Adding an indicator for rural districts to the model of reported bursts will move the rural estimates towards their true burst rates, because it lets rural districts have their own level.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The indicator learns the low reported counts of rural districts, most without sensors, so it moves the estimates of true rates further down.","misconceptions":["Assumes a predictor fitted to recorded data corrects a recording problem",""],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"rural-indicator","title":"A \"rural\" predictor fits the records better and the truth worse"},"level":"analyze","pool":"practice"},{"id":"q-funnel-cause","type":"single","prompt":"A centred hierarchical model of 49 small districts reports 59 divergences, all at small values of τ. Why there?","options":[{"key":"A","text":"Small τ squeezes every district effect into a narrow region, where the tuned step size is far too large"},{"key":"B","text":"The burst records of the districts with small τ contain errors that the sampler cannot fit"},{"key":"C","text":"Small τ shows the prior on τ is too narrow; widening it would remove the divergences"},{"key":"D","text":"The sampler ran out of draws before it could explore the small values of τ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"In the centred form the posterior has a funnel: its width shrinks with τ, so a step size suited to the mouth diverges in the neck.","misconceptions":["","Blames the data for a geometry of the parameterisation","Confuses a property of the posterior's shape with a prior that is too narrow","Thinks divergences come from too few draws"],"lo":["LO1","LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"the-funnel","title":"When τ is small, every district effect must squeeze into a narrow neck"},"level":"understand","pool":"practice"},{"id":"q-target-accept","type":"single","prompt":"Raising target_accept to 0.99 removed all divergences of a centred hierarchical model, but R-hat is 1.14. What do you conclude?","options":[{"key":"A","text":"The fit is now trustworthy"},{"key":"B","text":"Report the fit with a note about R-hat"},{"key":"C","text":"Run more chains until R-hat falls below 1.01 by chance"},{"key":"D","text":"The chains still disagree; rewrite the model in non-centred form"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"No divergences is necessary, not sufficient; disagreeing chains show the posterior is still not explored, and the cause is the geometry.","misconceptions":["Treats the absence of divergences as proof of a sound fit","Publishes numbers from chains that have not converged","Hopes more chains fix a geometry problem",""],"lo":["LO1"],"day":2,"session":3,"slide":{"deck":"day2","id":"target-accept-trap","title":"Raising target_accept removed the divergences and not the problem"},"level":"evaluate","pool":"practice"},{"id":"q-noncentred-same","type":"tf","prompt":"The centred and non-centred forms of a hierarchical model describe the same joint distribution of the data and the parameters.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the variables the sampler moves in change: η = μ + τ z with z standard normal has the distribution Normal(μ, τ).","misconceptions":["","Thinks non-centring changes the model's assumptions rather than its coordinates"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"centred-vs-noncentred","title":"Non-centred: sample standard district effects, then scale them by τ"},"level":"understand","pool":"practice"},{"id":"q-identification","type":"single","prompt":"In the model with a reporting share for districts without sensors, the posterior of the reporting share is almost identical to its Beta(14, 6) prior. What does that mean?","options":[{"key":"A","text":"The model failed to converge for the reporting share and must be refitted with more draws"},{"key":"B","text":"The prior was too wide for the data to move it, and a narrower prior would fix this"},{"key":"C","text":"The reporting share is now known to be exactly 0.70 in every district without sensors"},{"key":"D","text":"The counts cannot separate rate from reporting share, so the audit behind the prior carries the correction"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the product of rate and reporting share reaches the counts; the split comes from the prior, so its source must be stated.","misconceptions":["Takes a posterior equal to the prior as a computational failure","Thinks a narrower prior would make the data informative","Confuses the prior's mean with a known value",""],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"prior-carries-it","title":"The counts taught the model almost nothing about reporting"},"level":"analyze","pool":"practice"},{"id":"q-measurement-model","type":"single","prompt":"Bursts in districts without sensors are reported with probability p. Which likelihood for the reported count y of district j in a year follows?","options":[{"key":"A","text":"y ~ Poisson(km_j × rate_j)"},{"key":"B","text":"y ~ Poisson(km_j × rate_j × p_j)"},{"key":"C","text":"y ~ Poisson(km_j × rate_j) × p_j"},{"key":"D","text":"y ~ Poisson(km_j × rate_j / p_j)"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Thinning each burst with probability p keeps a Poisson count with its mean multiplied by p.","misconceptions":["Ignores the recording process","","Multiplies a count by a probability, which gives non-integer counts","Inverts the thinning"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"measurement-model","title":"Model what was recorded as a share of what happened"},"level":"apply","pool":"practice"},{"id":"q-ppc-statistic","type":"single","prompt":"A Poisson model of daily ambulance calls per station is fitted. Which posterior predictive check is most likely to reveal a problem the fit itself could hide?","options":[{"key":"A","text":"The total number of calls over the year, across all stations together"},{"key":"B","text":"The mean number of calls per station, compared station by station"},{"key":"C","text":"The variance of each station's daily calls divided by their mean"},{"key":"D","text":"The number of stations that received at least one call in the year"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The rates are fitted to reproduce totals and means; the ratio of variance to mean is not forced by the fit, and a Poisson fixes it at 1.","misconceptions":["Checks a statistic the fitted rates reproduce by construction","Checks a statistic the fitted rates reproduce by construction","","Confuses a property of the design with a property of the data"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"ppc-idea","title":"A model that fits should be able to produce data like yours"},"level":"apply","pool":"practice"},{"id":"q-ppc-pvalue","type":"single","prompt":"A posterior predictive check of the share of zero counts gives p = 0.12. What does this say?","options":[{"key":"A","text":"The model is wrong with 88% probability, so it should be replaced"},{"key":"B","text":"The check failed and must be repeated with more posterior draws"},{"key":"C","text":"The model is right with 12% probability, which is too low to use it"},{"key":"D","text":"The observed share sits within the range the model produces, towards its edge"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The p-value is the share of replicates at least as extreme as the data; 0.12 means the data are not unusual under the model, though near the edge of what it produces.","misconceptions":["Reads a predictive p-value as the probability that the model is wrong","Treats a moderate p-value as a computational failure","Reads a predictive p-value as the probability that the model is right",""],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"two-statistics","title":"The Poisson model cannot produce the year-to-year variation Yanabi records"},"level":"understand","pool":"practice"},{"id":"q-negbin-variance","type":"single","prompt":"A negative binomial with mean 4 and shape φ = 8 replaces a Poisson with mean 4. What is the variance of each?","options":[{"key":"A","text":"Poisson 4, negative binomial 6"},{"key":"B","text":"Both 4"},{"key":"C","text":"Poisson 4, negative binomial 32"},{"key":"D","text":"Poisson 16, negative binomial 6"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A Poisson's variance equals its mean; the negative binomial's is mean + mean²/φ = 4 + 16/8 = 6.","misconceptions":["","Thinks the same mean implies the same variance","Multiplies the mean by the shape instead of dividing its square","Squares the Poisson's mean"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"negbin","title":"A negative binomial lets each year vary more than a Poisson"},"level":"understand","pool":"practice"},{"id":"q-loo-difference","type":"single","prompt":"Two models of clinic waiting times: elpd -2,150 (SE 40) and -2,180 (SE 42); the difference is 30 with a standard error of 8. Which reading is right?","options":[{"key":"A","text":"No clear difference, because 30 is smaller than either model's own SE"},{"key":"B","text":"The comparison is invalid unless both models have the same number of parameters"},{"key":"C","text":"The second predicts better, because its larger SE means it captures more variation"},{"key":"D","text":"The first predicts held-out patients better: the difference is almost four of its own standard errors"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The models share most of their noise, so the difference is judged against the standard error of the difference, not against each model's own SE.","misconceptions":["Compares the difference with each model's own SE","Thinks leave-one-out needs models of equal size; it already accounts for complexity","Reads a larger SE as better",""],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"loo-table","title":"The negative binomial hierarchy predicts best, by far more than its error"},"level":"analyze","pool":"practice"},{"id":"q-pareto-k","type":"single","prompt":"Leave-one-out flags one school-year with Pareto k = 1.1: a fire closed the school for a term and inspections found many problems. What should the analyst do first?","options":[{"key":"A","text":"Delete the school-year: an event that rare should not drive the model's choice"},{"key":"B","text":"Confirm what happened, keep the real event, and prefer a model that such years do not overturn"},{"key":"C","text":"Ignore it: one school-year cannot matter much among 800 observations"},{"key":"D","text":"Raise the number of posterior draws until the Pareto k falls below 0.7"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A high k says one point moves the posterior a lot; a real event is kept and modelled, while an error would be corrected.","misconceptions":["Removes inconvenient real data and understates risk","","Thinks one influential point cannot change the conclusions","Treats k as a sampling problem that more draws fix"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"pareto-k","title":"D017's 2023 is the year a trunk main failed: keep it, choose a model it does not overturn"},"level":"apply","pool":"practice"},{"id":"q-why-not-r2","type":"single","prompt":"A report justifies a model by an R² of 0.91 between observed and fitted counts. Why is this weak evidence?","options":[{"key":"A","text":"R² cannot be computed for counts"},{"key":"B","text":"It rewards fitting the data already seen; a model with more parameters always scores higher"},{"key":"C","text":"0.91 is too low for count data"},{"key":"D","text":"R² is a frequentist measure and cannot be used with a Bayesian model"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Agreement with the data used to fit says little about prediction; leave-one-out scores each point by a model that did not see it.","misconceptions":["Thinks R² is undefined for counts","","Thinks a higher threshold would make in-sample fit convincing","Rejects a measure because of its school rather than what it measures"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"loo-idea","title":"Score each model on the district-years it did not see"},"level":"evaluate","pool":"practice"},{"id":"q-sbc-shape","type":"single","prompt":"In a simulation-based calibration, a parameter's rank histogram rises steadily from left to right. What does it indicate?","options":[{"key":"A","text":"The posterior is too wide, so the truth sits near its middle too often"},{"key":"B","text":"The code is correct, since the ranks cover the whole range from 0 to 99"},{"key":"C","text":"The sampler needs more chains, because the ranks have not yet mixed"},{"key":"D","text":"The posterior sits below the truth: the truth's rank is usually high"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A rank counts the draws below the truth; many high ranks mean most draws are below it, so the posterior is biased downwards.","misconceptions":["Confuses a slope with a hump","Reads any smooth histogram as uniform","Treats a bias in the model as a sampler setting",""],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"sbc-steps","title":"If the code is right, the truth's rank among the draws is uniform"},"level":"understand","pool":"practice"},{"id":"q-sbc-single-run","type":"single","prompt":"A colleague simulated one dataset from known parameters, fitted her model and recovered both inside their 90% intervals. She says the code is verified. What is the best reply?","options":[{"key":"A","text":"Agreed: recovering both parameters from known values is the standard test"},{"key":"B","text":"Not yet: repeat it with a larger dataset, and then the code is verified"},{"key":"C","text":"One run can pass by luck; rank the truth over many simulated datasets and check the ranks are uniform"},{"key":"D","text":"Verification is impossible for Bayesian models, so a plausible fit must do"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A wrong model can cover the truth on one dataset and a right one misses 10% of the time; only the distribution of ranks over many runs tests the code.","misconceptions":["Treats one recovery as proof","Thinks more data per run replaces more runs","","Believes Bayesian code cannot be tested"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"one-run-proves-little","title":"One successful recovery proves little"},"level":"evaluate","pool":"practice"},{"id":"q-sbc-limit","type":"single","prompt":"A model passes simulation-based calibration. Which error could it still contain?","options":[{"key":"A","text":"A prior written with a variance where the scale belongs, in the model only"},{"key":"B","text":"A likelihood that assumes Poisson counts when the real data are overdispersed"},{"key":"C","text":"A wrong parameterisation of the negative binomial in the model only"},{"key":"D","text":"A sampler that cannot reach part of the posterior"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Calibration tests the model against its own simulator; a wrong assumption about the world, made in both, passes. Predictive checks against real data find it.","misconceptions":["Misses that a mismatch between model and simulator is exactly what calibration finds","","Misses that a mismatch between model and simulator is exactly what calibration finds","Misses that a sampler failing to explore distorts the ranks"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"sbc-limits","title":"Calibration tests the code against the simulator, not the model against the world"},"level":"analyze","pool":"practice"},{"id":"q-power-scaling","type":"single","prompt":"Power-scaling the priors by 0.8 and 1.25 moves the posterior mean of a district's rate by 0.6 posterior standard deviations. What does that suggest?","options":[{"key":"A","text":"The prior does much of the work for this quantity: report it and test alternative priors"},{"key":"B","text":"The data dominate the priors for this quantity, since the shift is below one sd"},{"key":"C","text":"The sampler has not converged, because the mean moves when the prior changes"},{"key":"D","text":"The rate is unreliable and must be removed from the report to Nouran"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A shift of more than a fraction of a posterior sd when the prior is slightly weakened or strengthened means the answer depends on the prior.","misconceptions":["","Reads a large shift as a small one","Confuses prior sensitivity with a convergence problem","Thinks a prior-sensitive quantity cannot be reported"],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"power-scaling","title":"Make the priors a little weaker and a little stronger, and see what moves"},"level":"understand","pool":"practice"},{"id":"q-which-prior","type":"single","prompt":"Three priors on the spread between districts give the same 15 riskiest districts, but the reporting share of districts without sensors comes only from an audit-based prior. What belongs in the memo?","options":[{"key":"A","text":"That the results are robust to the priors, as the three spread priors showed"},{"key":"B","text":"Nothing about priors: the director needs the plan, not the modelling choices"},{"key":"C","text":"The spread prior does not change the plan; the reporting prior carries the rural estimates and rests on one audit"},{"key":"D","text":"Replace the reporting prior with a flat one, so that the memo is objective"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Sensitivity is a property of each prior and question; the prior the data cannot check must be named with its source.","misconceptions":["Generalises from the priors tested to all of them","Hides the assumption that drives part of the answer","","Thinks a flat prior is neutral when the data cannot identify the quantity"],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"which-prior-matters","title":"The prior that matters is the one on reporting, and it rests on one audit"},"level":"evaluate","pool":"practice"},{"id":"q-eu-order","type":"single","prompt":"You have 2,000 posterior draws of each clinic's demand and a cost for each of three staffing options in each draw. How do you choose an option for a clinic by expected utility?","options":[{"key":"A","text":"Average each option's cost over the draws, then choose the option with the lowest average"},{"key":"B","text":"Choose the best option in each draw, then take the option chosen most often"},{"key":"C","text":"Compute the cost at the posterior median demand and choose"},{"key":"D","text":"Choose the option whose cost varies least across draws"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Expected utility averages the consequence of each action over the posterior, then chooses; a vote over draws ignores how large the losses are.","misconceptions":["","Counts how often an option wins instead of by how much","Uses a plug-in estimate, which differs when the posterior is skewed or the cost is not linear","Minimises variability instead of expected cost"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"eu-steps","title":"Average the cost over the posterior, then choose"},"level":"apply","pool":"practice"},{"id":"q-plugin-linear","type":"single","prompt":"Every cost in a decision is a straight line in an uncertain rate. Which plug-in estimate gives the same choice as expected utility?","options":[{"key":"A","text":"The posterior median"},{"key":"B","text":"The posterior mode"},{"key":"C","text":"The posterior mean"},{"key":"D","text":"The upper end of the 90% interval"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The expectation of a linear function is the function at the mean, so deciding at the mean rate is exact for linear costs.","misconceptions":["Thinks the median is the natural summary for every decision","Thinks the most probable value gives the expected cost","","Confuses a cautious rule with expected utility"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"plug-in","title":"Deciding on the median rate gets three rural districts wrong"},"level":"analyze","pool":"practice"},{"id":"q-cost-formula","type":"single","prompt":"A 5 km district has a rate of 0.2 bursts per km-year. A burst costs SAR 80,000; over 20 years, repair costs SAR 40,000 per km and removes 30% of bursts for 10 years. What is the expected cost of repairing?","options":[{"key":"A","text":"SAR 1.36 million"},{"key":"B","text":"SAR 1.60 million"},{"key":"C","text":"SAR 1.32 million"},{"key":"D","text":"SAR 1.56 million"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Investment 5 × 40,000 = 0.2 million; bursts 0.2 × 5 × (20 − 10 × 0.3) = 17, costing 1.36 million; total 1.56 million.","misconceptions":["Forgets the investment","Uses the cost of waiting (20 bursts) and forgets the reduction","Applies the reduction for all 20 years",""],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"decision-table","title":"Three actions, one cost each, computed for every posterior draw"},"level":"apply","pool":"practice"},{"id":"q-budget-increment","type":"single","prompt":"A school can get a short visit (SAR 9,000, value 20,000) or a full audit (SAR 30,000, value 35,000 in all). Under a tight budget, how should the audit be ranked against other schools' options?","options":[{"key":"A","text":"By its whole ratio, 35,000 / 30,000 ≈ 1.17 per riyal, like any other option"},{"key":"B","text":"By its total value of 35,000, since the audit gives the most value of the two"},{"key":"C","text":"By the extra 15,000 for the extra 21,000: about 0.71 per riyal, after the visit"},{"key":"D","text":"It should never be considered, because a tight budget allows only short visits"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The audit upgrades the visit; its ranking uses what it adds over the visit, not its total.","misconceptions":["Ranks the whole option, mixing in the cheaper option's value","Ranks by value and ignores cost","","Excludes expensive options without comparing them"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"budget-bind","title":"The best plan for each district costs SAR 61 million; the budget is 40"},"level":"apply","pool":"practice"},{"id":"q-plan-interval","type":"single","prompt":"How is the 90% interval of bursts avoided by a fixed plan obtained from the posterior?","options":[{"key":"A","text":"By applying the same plan in every posterior draw and taking quantiles of the avoided bursts"},{"key":"B","text":"From the standard error of the mean rate times the network length"},{"key":"C","text":"By refitting the model with the plan's districts removed"},{"key":"D","text":"By adding the intervals of the funded districts"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The plan's outcome is a function of the uncertain rates; evaluating it in each draw gives its distribution.","misconceptions":["","Uses a frequentist approximation that ignores the joint posterior","Confuses evaluating a plan with cross-validation","Adds interval ends, which overstates the width"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"the-plan","title":"43 districts within the budget, with an interval on what they avoid"},"level":"understand","pool":"practice"},{"id":"q-remaining-risk","type":"single","prompt":"A capital plan funds 43 districts. What else should the decision memo state about the districts it does not fund?","options":[{"key":"A","text":"Nothing: districts outside the plan are outside the memo's question"},{"key":"B","text":"Their names only, listed in an annex for completeness"},{"key":"C","text":"Their expected bursts, who bears them, and which districts the model knows least about"},{"key":"D","text":"That they are safe until the next budget, as their expected costs are lower"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A plan is also a choice about who waits; the memo names the remaining risk and the districts whose estimates rest mainly on assumptions.","misconceptions":["Treats the unfunded list as no decision","Lists without the risk carried","","Reads not funded as not at risk"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"remaining-risk","title":"Name who carries the risk the plan leaves, and where the model knows least"},"level":"evaluate","pool":"practice"},{"id":"q-evpi-bound","type":"single","prompt":"Perfect information on all 76 districts is worth SAR 2.4 million. A survey of all 76 costs SAR 3.4 million. What follows before simulating the survey?","options":[{"key":"A","text":"The survey might still be worth buying if its error is small"},{"key":"B","text":"The full survey is not worth its price: no real survey is worth more than perfect information"},{"key":"C","text":"The survey must be bought to know its value"},{"key":"D","text":"Perfect information is impossible, so the comparison is meaningless"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The expected value of perfect information is an upper bound on the value of any survey; if it is below the price, the offer fails.","misconceptions":["Thinks a survey can be worth more than perfect knowledge","","Thinks value can only be known after buying","Misses that an unreachable bound is still a valid bound"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"survey-numbers","title":"Decline the full survey; propose 16 districts"},"level":"analyze","pool":"practice"},{"id":"q-evsi-where","type":"single","prompt":"For which district is a survey of its true burst rate worth most to a re-piping decision?","options":[{"key":"A","text":"One with a very uncertain rate whose best action is the same in every draw"},{"key":"B","text":"One with a rate known precisely"},{"key":"C","text":"One near the threshold between two actions, with a moderately uncertain rate"},{"key":"D","text":"The largest district, whatever its rate"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Information has value only where it can change the action; that is where the posterior straddles a threshold.","misconceptions":["Equates value of information with uncertainty alone","Has no uncertainty left to resolve","","Equates size with value of information"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"voi-idea","title":"Information is worth what it would change in the decision"},"level":"apply","pool":"practice"},{"id":"q-preposterior","type":"single","prompt":"In a preposterior analysis of a survey with 15% error, what is simulated for each posterior draw?","options":[{"key":"A","text":"A new model fit with more chains, to see how the posterior would move"},{"key":"B","text":"The survey's price under different budgets, to find the affordable size"},{"key":"C","text":"A replicated dataset of past bursts, as in a posterior predictive check"},{"key":"D","text":"The survey's report if that draw's rate were true, the updated choice, and its cost under that truth"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The survey's value is the expected cost saved by deciding after its result, averaged over what the result could be.","misconceptions":["Confuses valuing data with improving computation","Confuses the price with the value","Confuses it with a posterior predictive check",""],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"voi-idea","title":"Information is worth what it would change in the decision"},"level":"understand","pool":"practice"},{"id":"q-review-finding","type":"single","prompt":"Which is the most useful finding in a review of a Bayesian analysis?","options":[{"key":"A","text":"Two chains and R-hat judged against 1.1: the fit is not shown trustworthy, so its ranking cannot be used yet"},{"key":"B","text":"The model is too simple for a network of 140 districts and should be extended"},{"key":"C","text":"The author should have used Stan or NumPyro instead of the package they chose"},{"key":"D","text":"The priors look arbitrary and are not explained anywhere in the report"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A finding quotes what was done, gives the evidence and says what it does to the conclusions.","misconceptions":["","Gives an opinion without evidence or consequence","Prescribes a tool instead of identifying a flaw","Gives an opinion without evidence or consequence"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-review","title":"Writing one finding"},"level":"evaluate","pool":"practice"},{"id":"q-review-rank","type":"single","prompt":"A report estimates each district alone and also ran two chains with 37 divergences. Which flaw is likely to change the list of districts most, and why?","options":[{"key":"A","text":"The divergences: any computational warning invalidates everything equally"},{"key":"B","text":"Estimating districts alone: small districts reach the top on noise even if the computation were perfect"},{"key":"C","text":"Both equally: flaws cannot be ranked"},{"key":"D","text":"Neither: the list is what the data say"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A correct computation of the wrong structure still ranks noisy small districts high; ranking flaws by effect on the decision puts structure first here.","misconceptions":["Ranks by how alarming a flaw looks rather than its effect","","Refuses to prioritise","Thinks no structure was imposed by estimating alone"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"rank-flaws","title":"Rank the flaws by what they do to the decision, not by how wrong they look"},"level":"evaluate","pool":"practice"},{"id":"q-review-zero","type":"single","prompt":"A consultant declares 13 districts with no recorded burst in five years safe. Which two checklist items does the reviewer cite?","options":[{"key":"A","text":"Priors and computation: a flat prior and too few chains"},{"key":"B","text":"Checking and decision: no predictive check and no costs"},{"key":"C","text":"Computation and checking: divergences and R² taken as fit"},{"key":"D","text":"Structure (no pooling) and measurement (unrecorded bursts)"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"No pooling gives a zero count a rate near zero, and without sensors a zero may mean bursts that were never recorded.","misconceptions":["Looks for the cause in the prior and the sampler","Cites downstream items instead of the cause","Looks for the cause in the sampler and the checks",""],"lo":["LO6","LO2"],"day":4,"session":4,"slide":{"deck":"day4","id":"review-checklist","title":"Six questions, in the order of the workflow"},"level":"analyze","pool":"practice"}]}</script>
